  - Develop & test: development.md
  - Decisions:
      - "1. One Postgres per service": adr/0001-one-postgres-per-service.md
      - "2. Reservations with expiry": adr/0002-reservations-with-expiry.md
      - "3. Seed inserts only missing products": adr/0003-seed-inserts-only-missing-products.md
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
