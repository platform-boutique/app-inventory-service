apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: inventory-service
  title: inventory-service
  description: "A gRPC service that owns the stock of the Everly shop and the reservations checkout places while an order is paid and shipped."
  annotations:
    github.com/project-slug: platform-boutique/app-inventory-service
    backstage.io/source-location: url:https://github.com/platform-boutique/app-inventory-service/tree/main/
    backstage.io/techdocs-ref: dir:.
    grafana/dashboard-selector: "tags @> 'inventory'"
    grafana/alert-label-selector: "service=inventory-service"
  tags: [go, grpc, postgres]
spec:
  type: service
  lifecycle: experimental
  owner: group:default/maintainers
  system: everly
  providesApis: [inventory-service-api]
  dependsOn:
    - resource:default/inventory-db
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: inventory-db
  description: Postgres database owned by inventory-service (stock, reservations, reservation_items).
spec:
  type: database
  owner: group:default/maintainers
  system: everly
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: inventory-service-api
  description: gRPC interface of inventory-service (Protocol Buffers).
  tags: [grpc, protobuf]
  links:
    - { url: "https://github.com/platform-boutique/app-inventory-service/blob/main/proto/inventory.proto", title: "inventory.proto on GitHub", icon: code }
spec:
  type: grpc
  lifecycle: experimental
  owner: group:default/maintainers
  system: everly
  definition:
    $text: ./proto/inventory.proto
